[project]
name = "site-cloner"
version = "0.2.0"
description = "Conversational CLI agent that clones any website using Gemini."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dibyo Chakraborty" }]
dependencies = [
  "google-genai>=0.3.0",
  "textual>=0.85.0",
  "httpx>=0.27.0",
  "selectolax>=0.3.21",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "playwright>=1.48.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[project.scripts]
site-cloner = "scaler_cloner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaler_cloner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
